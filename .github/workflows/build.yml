name: Build Sarhad Squad Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarhad-squad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # One permanent download link: every build replaces the APK on the
      # fixed "build-latest" release, so the URL never changes.
      - name: Publish the APK to the build-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: build-latest
          files: app/build/outputs/apk/debug/app-debug.apk
